[tool.poetry]
name = "python-template"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
# Application, not a library: there is no importable package to install, and Poetry 2.x
# otherwise fails `poetry install` with "No file/folder found for package python-template".
package-mode = false

[tool.poetry.dependencies]
# 3.10 is the lowest interpreter that unlocks the fixed aiohttp/urllib3/ujson/requests
# releases (all require >=3.10); capped at <3.13 so numpy 1.26.x resolves for the range.
python = ">=3.10,<3.13"
numpy = "^1.26.4"
Flask = "^3.1.3"
# The `replit` package is not imported anywhere in this repo and its latest release
# (4.1.2) pins protobuf<5, which is unavoidably vulnerable (fixed only in >=5.29.6), so
# it was removed instead of pinned.
"discord.py" = "^2.7.1"
# Security: minimum fixed versions (transitive deps pinned to clear advisories)
certifi = "==2024.7.4"
idna = "==3.15"
jinja2 = "==3.1.6"
requests = ">=2.33.0"
urllib3 = ">=2.8.0"
werkzeug = ">=3.1.6"
zipp = "==3.19.1"

[tool.poetry.dev-dependencies]
debugpy = "^1.6.2"
python-lsp-server = {extras = ["yapf", "rope", "pyflakes"], version = "^1.5.0"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"